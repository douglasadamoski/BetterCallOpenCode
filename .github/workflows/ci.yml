name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    # First job on purpose: this repo's whole promise is that it does not leak keys.
    # The behavioural half of that guarantee lives in tests/test_pack_secrets.py so it
    # can be run locally too; this job only scans what is actually committed.
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/scan_secrets.sh

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: shellcheck
        run: |
          echo "--- advisory: warning + style ---"
          shellcheck -S style -f gcc scripts/*.sh || true
          echo "--- blocking: errors ---"
          shellcheck -S error -f gcc scripts/*.sh

  pytest:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install --quiet pytest
      # No network in CI: the suite must be fully offline. A test that reached
      # OpenRouter would silently spend the maintainer's free daily requests.
      - run: pytest -q tests/

  syntax:
    name: syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every script must parse
        run: |
          set -euo pipefail
          for f in scripts/*.sh; do bash -n "$f"; done
          for f in scripts/*.py tests/*.py; do python3 -m py_compile "$f"; done
          echo "all scripts parse"
