name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    # First job on purpose: this repo's whole promise is that it does not leak keys.
    # The behavioural half of that guarantee lives in tests/test_pack_secrets.py so it
    # can be run locally too; this job only scans what is actually committed.
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/scan_secrets.sh

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: shellcheck
        run: |
          echo "--- advisory: style and info (never blocking) ---"
          shellcheck -S style -f gcc scripts/*.sh || true
          echo "--- blocking: warnings and errors ---"
          # Raised from -S error. Warning-class findings here are things like unquoted
          # expansions and `cd` without a guard, in scripts that handle paths from the
          # user's project — worth failing a build over, not worth an advisory nobody
          # reads.
          #
          # No --exclude. The two SC2034 sites are cross-file false positives (a sourced
          # library's vars, and one read back by tests/test_redaction.py) and each
          # carries an inline disable naming its consumer, so the reason lives next to
          # the code rather than in this workflow.
          shellcheck -S warning -f gcc scripts/*.sh

  pytest:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install --quiet pytest
      # No network in CI: the suite must be fully offline. A test that reached
      # OpenRouter would silently spend the maintainer's free daily requests.
      # tests/conftest.py enforces that in-process by replacing urllib's urlopen;
      # --strict-markers makes a typo in the `allow_network` opt-out an error rather
      # than a marker that quietly does nothing.
      - run: pytest -q --strict-markers tests/

  syntax:
    name: syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every script must parse
        run: |
          set -euo pipefail
          for f in scripts/*.sh; do bash -n "$f"; done
          for f in scripts/*.py tests/*.py; do python3 -m py_compile "$f"; done
          echo "all scripts parse"
